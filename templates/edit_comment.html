{% extends "base.html" %}

{% block content %}

<h2>Edit Comment</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <textarea name="body" rows="4" required>{{ comment.body }}</textarea>
    <br><br>
    <button type="submit">Save</button>
    <a href="{{ url_for('home') }}">Cancel</a>
</form>

{% endblock %}
