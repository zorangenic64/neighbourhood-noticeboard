{% extends "base.html" %}

{% block content %}

<h2>Edit Comment</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <textarea name="body" rows="4" cols="60">{{ comment.body }}</textarea>

    <div>
        <button type="submit">Save</button>
        <a href="{{ url_for('home') }}">
            <button type="button">Cancel</button>
        </a>
    </div>
</form>

{% endblock %}
