<!DOCTYPE html>

<html>
<head>
    <title>Login</title>
</head>
<body>

<h1>Login</h1>

{% if error %}

<p style="color:red;">
    {{ error }}
</p>
{% endif %}

<form method="post">

        <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


<p>
    Username:
    <input type="text" name="username" required>
</p>

<p>
    Password:
    <input type="password" name="password" required>
</p>

<button type="submit">
    Login
</button>


</form>

<p>
    <a href="{{ url_for('forgot_password') }}">
        Forgot your password?
    </a>
</p>

<p>
    <a href="/">Back to notice board</a>
</p>

</body>
</html>
