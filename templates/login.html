{% extends "base.html" %}

{% block page_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/post-form.css') }}">
{% endblock %}

{% block body_class %}public-page post-form-page{% endblock %}

{% block content %}
<main class="post-form-shell">
    <header class="form-page-heading">
        <h2>Login</h2>
    </header>

    {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" class="post-editor">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-field form-field--wide">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" required>
        </div>

        <div class="form-field form-field--wide">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="post-button primary-action">Login</button>
        </div>
    </form>

    <nav class="login-links" aria-label="Account links">
        <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
        <a href="{{ url_for('home') }}">Back to notice board</a>
    </nav>
</main>
{% endblock %}
