{% extends "base.html" %}

{% block page_styles %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/post-form.css') }}">
{% endblock %}

{% block body_class %}public-page post-form-page recovery-page{% endblock %}

{% block content %}
<main class="post-form-shell">
    <header class="form-page-heading">
        <h2>Forgot Password</h2>
    </header>

    <p class="recovery-intro">Enter your username to begin recovering your account.</p>

    {% if error %}
        <p class="form-error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post" class="post-editor">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-field form-field--wide">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" minlength="3" maxlength="25" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="post-button primary-action">Continue</button>
            <a href="{{ url_for('cancel_password_recovery') }}" class="post-button cancel-action">Cancel</a>
        </div>
    </form>
</main>

{% endblock %}
