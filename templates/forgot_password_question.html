{% extends "base.html" %}

{% block content %}

<h2>Forgot Password</h2>

<p>
    Answer your security question to continue.
</p>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<p>
    <strong>Security question:</strong>
</p>

<p>
    {{ security_question }}
</p>

<form method="post">

        <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <p>
        <label for="security_answer">
            Security answer
        </label><br>

        <input
            type="text"
            id="security_answer"
            name="security_answer"
            maxlength="255"
            autocomplete="off"
            required
        >
    </p>

    <button
        type="submit"
        class="post-button"
    >
        Verify Answer
    </button>

    <a
        href="{{ url_for('forgot_password') }}"
        class="post-button"
    >
        Start Again
    </a>

</form>

{% endblock %}
