<!DOCTYPE html>

<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neighbourhood Notice Board</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ccc;
        }

        .menu {
            margin-bottom: 20px;
        }

        .menu a {
            display: inline-block;
            padding: 8px 12px;
            margin-right: 8px;
            margin-bottom: 8px;
            background: #e6e6e6;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: black;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .menu a:hover {
            background: #d9d9d9;
        }

        .menu a.active {
            background: #007bff;
            border-color: #007bff;
            color: white;
        }

        .post {
            border: 1px solid #ccc;
            margin-bottom: 15px;
            padding: 10px;
        }

        .post-button {
            display: inline-block;
            box-sizing: border-box;
            padding: 6px 12px;
            margin-right: 6px;
            background: #e6e6e6;
            border: 1px solid #ccc;
            border-radius: 6px;
            text-decoration: none;
            color: black;
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: normal;
            cursor: pointer;
            vertical-align: middle;
            appearance: none;
            -webkit-appearance: none;
        }

        .post-button:hover {
            background: #d9d9d9;
        }

        .category {
            color: #666;
            font-size: 0.9em;
        }

        .comment-count {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .user-info {
            font-size: 0.9em;
        }

        .user-info a {
            margin-left: 10px;
        }

        .comment {
            margin-top: 10px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 6px;
        }

        .comment-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .comment-time {
            font-size: 0.8em;
            color: #666;
        }

        .comment-meta-separator {
            color: #999;
        }

        .comment-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .comment-form {
            margin-top: 12px;
        }

        .pick-button {
            border: none;
            background: none;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .pick-button.picked {
            color: blue;
            font-weight: bold;
        }

        .post-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .meta-separator {
            color: #999;
        }

        .post-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .inline-form {
            display: inline;
            margin: 0;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 12px 0 18px 0;
        }

        .search-bar input,
        .search-bar select {
            padding: 8px 10px;
            font-size: 14px;
        }

        .search-bar input {
            flex: 1;
        }

        @media (max-width: 600px) {
            body {
                font-size: 18px;
            }

            .topbar {
                display: block;
            }

            .topbar h1 {
                font-size: 26px;
            }

            .user-info {
                font-size: 17px;
            }

            .menu a {
                font-size: 17px;
                padding: 10px 14px;
            }

            .post h2 {
                font-size: 23px;
            }

            .category {
                font-size: 16px;
            }

            .comment-count {
                font-size: 16px;
            }

            .post-button,
            .pick-button {
                font-size: 17px;
                padding: 9px 13px;
            }
        }
    </style>
    {% block page_styles %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <div class="topbar">
        <h1>Neighbourhood Notice Board</h1>

        <div class="user-info">
            {% if current_user.is_authenticated %}
                <span>{{ current_user.username }}</span>
                <span>|</span>
                <span>{{ current_user.default_location }}</span>

                <a href="{{ url_for('account') }}" class="post-button">Account</a>
                <a href="{{ url_for('create_post') }}" class="post-button">Post</a>

                <form method="post" action="{{ url_for('logout') }}" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="post-button">Logout</button>
                </form>
            {% else %}
                <a href="{{ url_for('login') }}" class="post-button">Login</a>
                <a href="{{ url_for('register') }}" class="post-button">Register</a>
            {% endif %}
        </div>
    </div>

    {% block content %}
    {% endblock %}

    <script>
        function getCommentStateKey(postId) {
            return "comments_open_" + postId;
        }

        function applyCommentState(postId, isOpen) {
            const area = document.getElementById("comments-" + postId);
            if (!area) return;
            area.style.display = isOpen ? "block" : "none";
            localStorage.setItem(getCommentStateKey(postId), isOpen ? "1" : "0");
        }

        function toggleComments(postId) {
            const area = document.getElementById("comments-" + postId);
            if (!area) return;

            const currentlyOpen = area.style.display !== "none";
            applyCommentState(postId, !currentlyOpen);
        }

        const commentScrollKey = "comment_form_scroll_y";

        document.querySelectorAll(".comment-form").forEach(function (form) {
            form.addEventListener("submit", function () {
                sessionStorage.setItem(commentScrollKey, String(window.scrollY));
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll("[data-character-limit]").forEach(function (field) {
                const maximum = Number(field.getAttribute("maxlength"));
                const counter = document.getElementById(field.dataset.characterCount);
                if (!counter || !Number.isFinite(maximum)) return;

                const updateCounter = function () {
                    counter.textContent = Math.max(0, maximum - field.value.length)
                        + " characters remaining";
                };

                field.addEventListener("input", updateCounter);
                updateCounter();
            });

            document.querySelectorAll("[id^='comments-']").forEach(function (area) {
                const postId = area.id.replace("comments-", "");
                const saved = localStorage.getItem(getCommentStateKey(postId));

                if (saved === null) {
                    area.style.display = "none";
                    return;
                }

                area.style.display = saved === "1" ? "block" : "none";
            });

            const savedScrollY = sessionStorage.getItem(commentScrollKey);
            if (savedScrollY !== null) {
                sessionStorage.removeItem(commentScrollKey);
                window.requestAnimationFrame(function () {
                    window.scrollTo(0, Number(savedScrollY));
                });
            }
        });
    </script>
</body>
</html>
