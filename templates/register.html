{% extends "base.html" %}

{% block content %}

<h2>Register New User</h2>

<style>

    .password-check {
        margin: 4px 0;
    }

    .check-fail {
        color: red;
    }

    .check-pass {
        color: green;
    }

    #strength-text {
        font-weight: bold;
    }

    .strength-very-weak {
        color: red;
    }

    .strength-weak {
        color: pink;
    }

    .strength-fair {
        color: orange;
    }

    .strength-strong {
        color: lightgreen;
    }

    .strength-very-strong {
        color: green;
    }

</style>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label>Username</label>
    <input type="text" name="username" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required>

    <label>Security Question</label>
    <input type="text" name="security_question" required>

    <label>Security Answer</label>
    <input type="text" name="security_answer" required>

    <label>Default Location</label>
    <select name="default_location" required>
        {% for loc in locations %}
            <option value="{{ loc }}">{{ loc }}</option>
        {% endfor %}
    </select>

    <button type="submit">Register</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

<script>

    const passwordInput =
        document.getElementById("password");

    passwordInput.addEventListener(
        "input",
        function () {

            const password =
                passwordInput.value;

            const lengthCheck =
                document.getElementById("length-check");

            const uppercaseCheck =
                document.getElementById("uppercase-check");

            const numberCheck =
                document.getElementById("number-check");

            const symbolCheck =
                document.getElementById("symbol-check");

            const strengthText =
                document.getElementById("strength-text");

            // Check password requirements

            const hasLength =
                password.length >= 8;

            const hasUppercase =
                /[A-Z]/.test(password);

            const hasNumber =
                /[0-9]/.test(password);

            const hasSymbol =
                /[^A-Za-z0-9]/.test(password);

            // Update requirement indicators

            function updateCheck(
                element,
                passed,
                text
            ) {

                element.textContent =
                    (passed ? "✓ " : "✗ ")
                    + text;

                element.classList.remove(
                    "check-pass",
                    "check-fail"
                );

                element.classList.add(
                    passed
                        ? "check-pass"
                        : "check-fail"
                );
            }

            updateCheck(
                lengthCheck,
                hasLength,
                "At least 8 characters"
            );

            updateCheck(
                uppercaseCheck,
                hasUppercase,
                "At least one capital letter"
            );

            updateCheck(
                numberCheck,
                hasNumber,
                "At least one number"
            );

            updateCheck(
                symbolCheck,
                hasSymbol,
                "At least one symbol"
            );

            // Password strength

            if (password.length === 0) {

                strengthText.textContent =
                    "Not entered";

                strengthText.classList.remove(
                    "strength-very-weak",
                    "strength-weak",
                    "strength-fair",
                    "strength-strong",
                    "strength-very-strong"
                );

                return;
            }

            const result =
                zxcvbn(password);

            const strengthNames = [
                "Very Weak",
                "Weak",
                "Fair",
                "Strong",
                "Very Strong"
            ];

            const strengthClasses = [
                "strength-very-weak",
                "strength-weak",
                "strength-fair",
                "strength-strong",
                "strength-very-strong"
            ];

            strengthText.textContent =
                strengthNames[result.score];

            strengthText.classList.remove(
                "strength-very-weak",
                "strength-weak",
                "strength-fair",
                "strength-strong",
                "strength-very-strong"
            );

            strengthText.classList.add(
                strengthClasses[result.score]
            );

        }
    );

</script>

<script>

    const usernameInput =
        document.getElementById("username");

    const usernameFeedback =
        document.getElementById("username-feedback");

    let usernameIsValid = false;


    usernameInput.addEventListener(
        "blur",
        async function () {

            const username =
                usernameInput.value.trim();

            usernameFeedback.textContent = "";
            usernameFeedback.style.color = "";

            usernameIsValid = false;

            if (!username) {
                return;
            }

            usernameFeedback.textContent =
                "Checking username...";

            usernameFeedback.style.color =
                "gray";

            try {

                const response = await fetch(
                    "{{ url_for('check_username') }}?username="
                    + encodeURIComponent(username)
                );

                const result =
                    await response.json();

                usernameFeedback.textContent =
                    result.message;

                if (result.valid) {

                    usernameFeedback.style.color =
                        "green";

                    usernameIsValid = true;

                } else {

                    usernameFeedback.style.color =
                        "red";
                }

            } catch (error) {

                usernameFeedback.textContent =
                    "Unable to check username right now.";

                usernameFeedback.style.color =
                    "red";

                usernameIsValid = false;
            }
        }
    );

</script>

{% endblock %}
