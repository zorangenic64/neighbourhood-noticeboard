{% extends "base.html" %}

{% block content %}

<h2>Reset Password</h2>

<p>
    Enter a new password for your account.
</p>

{% if error %}
    <p style="color: red;">
        {{ error }}
    </p>
{% endif %}

<form method="post">

        <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <p>
        <label for="new_password">
            New password
        </label><br>

        <input
            type="password"
            id="new_password"
            name="new_password"
            minlength="8"
            autocomplete="new-password"
            required
        >
    </p>

    <div
        id="password-requirements"
        style="margin-bottom: 15px;"
    >

        <p
            id="length-check"
            style="margin: 3px 0;"
        >
            <span id="length-icon">✗</span>
            At least 8 characters
        </p>

        <p
            id="uppercase-check"
            style="margin: 3px 0;"
        >
            <span id="uppercase-icon">✗</span>
            At least one capital letter
        </p>

        <p
            id="number-check"
            style="margin: 3px 0;"
        >
            <span id="number-icon">✗</span>
            At least one number
        </p>

        <p
            id="symbol-check"
            style="margin: 3px 0;"
        >
            <span id="symbol-icon">✗</span>
            At least one symbol
        </p>

    </div>

    <p>
        <strong>
            Password strength:
        </strong>

        <span id="password-strength">
            -
        </span>
    </p>

    <p>
        <label for="confirm_password">
            Confirm new password
        </label><br>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            autocomplete="new-password"
            required
        >
    </p>

    <button
        type="submit"
        class="post-button"
    >
        Reset Password
    </button>

    <a
        href="{{ url_for('login') }}"
        class="post-button"
    >
        Cancel
    </a>

</form>


<script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>


<script>

    const passwordInput =
        document.getElementById("new_password");

    const strengthDisplay =
        document.getElementById("password-strength");

    const lengthIcon =
        document.getElementById("length-icon");

    const uppercaseIcon =
        document.getElementById("uppercase-icon");

    const numberIcon =
        document.getElementById("number-icon");

    const symbolIcon =
        document.getElementById("symbol-icon");


    passwordInput.addEventListener(
        "input",
        function () {

            const password =
                passwordInput.value;


            const hasMinimumLength =
                password.length >= 8;

            const hasUppercase =
                /[A-Z]/.test(password);

            const hasNumber =
                /[0-9]/.test(password);

            const hasSymbol =
                /[^A-Za-z0-9]/.test(password);


            lengthIcon.textContent =
                hasMinimumLength ? "✓" : "✗";

            lengthIcon.style.color =
                hasMinimumLength ? "green" : "red";


            uppercaseIcon.textContent =
                hasUppercase ? "✓" : "✗";

            uppercaseIcon.style.color =
                hasUppercase ? "green" : "red";


            numberIcon.textContent =
                hasNumber ? "✓" : "✗";

            numberIcon.style.color =
                hasNumber ? "green" : "red";


            symbolIcon.textContent =
                hasSymbol ? "✓" : "✗";

            symbolIcon.style.color =
                hasSymbol ? "green" : "red";


            if (!password) {

                strengthDisplay.textContent =
                    "-";

                strengthDisplay.style.color =
                    "";

                return;
            }


            const result =
                zxcvbn(password);

            const score =
                result.score;


            const strengthNames = [
                "Very Weak",
                "Weak",
                "Fair",
                "Strong",
                "Very Strong"
            ];


            strengthDisplay.textContent =
                strengthNames[score];


            if (score === 0) {

                strengthDisplay.style.color =
                    "red";

            } else if (score === 1) {

                strengthDisplay.style.color =
                    "orange";

            } else if (score === 2) {

                strengthDisplay.style.color =
                    "blue";

            } else if (score === 3) {

                strengthDisplay.style.color =
                    "green";

            } else if (score === 4) {

                strengthDisplay.style.color =
                    "darkgreen";
            }

        }
    );

</script>

{% endblock %}
